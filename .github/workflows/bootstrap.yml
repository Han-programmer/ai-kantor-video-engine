name: Setup and render video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ai-kantor-video-engine-pro-v2.zip
          cp -a ai-kantor-video-engine-fixed/. .
          
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render MP4
        run: |
          python -m engine.render \
            --job jobs/example.json \
            --output output/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: ai-kantor-rendered-video
          path: output/
          
